name: Coverage Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest # This will need to be a self-hosted runner with Questasim installed
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run UVM Tests and Generate Coverage
        run: |
          chmod +x bin/run_uvm_tests.py
          ./bin/run_uvm_tests.py

      - name: Create Vendor-Neutral Coverage Directory
        run: |
          mkdir -p coverage_report_vendor_neutral
          cp coverage_report/lcov.info coverage_report_vendor_neutral/
          cp coverage_report/cobertura.xml coverage_report_vendor_neutral/
          cp coverage_report/summary.json coverage_report_vendor_neutral/
          cp coverage_report/index.html coverage_report_vendor_neutral/
          cp coverage_report/style.css coverage_report_vendor_neutral/
          cp coverage_report/trl5_metrics.json coverage_report_vendor_neutral/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coverage_report_vendor_neutral
          destination_dir: coverage_report
          enablement: true
          exclude_assets: ''
          force_orphan: true
          keep_files: false
          allow_empty_commit: false
          commit_message: 'Update coverage report [skip ci]'
